[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-learning-copilot"
version = "0.3.0"
description = "A fast desktop screenshot translator and AI learning assistant."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.6",
  "mss>=9.0",
  "pynput>=1.7",
  "rapidocr-onnxruntime>=1.4",
]

[project.optional-dependencies]
ocr = []
dev = [
  "pytest>=8.0",
]

[project.scripts]
ai-learning-copilot = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]
